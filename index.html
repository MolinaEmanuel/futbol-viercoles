<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Torneo Apertura 2026 - Fútbol Miércoles">
  <title>Futbol Viércoles</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="assets/images/logo/isologo FV.png" type="image/png">
</head>

<body>

  <!-- LOADER -->
  <div id="loader" class="loader" aria-label="Cargando...">
    <div class="spinner"></div>
  </div>

  <!-- VIDEO BANNER -->
  <div class="video-banner" aria-hidden="true">
    <video autoplay muted loop playsinline preload="none">
      <source src="assets/video/video web.mp4" type="video/mp4">
    </video>
  </div>

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <img src="assets/images/logo/logo futbol viercoles.png" alt="Logo Fútbol Viércoles" class="logo-principal">
    </div>
    <div class="header-center">
      <h1>Torneo Apertura 2026</h1>
      <h2>Julio "Messi" Gimenez</h2>
    </div>
    <div class="header-right">
      <img src="assets/images/logo/logo conmebol.png" alt="Logo CONMEBOL" class="logo-secundario">
    </div>
  </header>

  <!-- NAVBAR DESKTOP -->
  <nav class="topbar" role="navigation" aria-label="Menú principal">
    <button onclick="mostrarSeccion('inicio')" class="nav-btn active-nav" data-section="inicio">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Inicio
    </button>
    <button onclick="mostrarSeccion('plantel')" class="nav-btn" data-section="plantel">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Plantel
    </button>
    <button onclick="mostrarSeccion('historial')" class="nav-btn" data-section="historial">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Historial
    </button>
    <button onclick="mostrarSeccion('ranking')" class="nav-btn" data-section="ranking">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
      Ranking MVP
    </button>
    <button onclick="mostrarSeccion('novedades')" class="nav-btn" data-section="novedades">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      Novedades
    </button>
    <button onclick="mostrarSeccion('cumples')" class="nav-btn" data-section="cumples">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Cumpleaños
    </button>
    <button onclick="mostrarSeccion('palmares')" class="nav-btn" data-section="palmares">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
      Palmarés
    </button>
    <button onclick="abrirLogin()" class="nav-btn btn-admin" id="btnAdminLogin" title="Modo Admin">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </button>
    <button onclick="logout()" class="nav-btn btn-logout" id="btnAdminLogout" style="display:none" title="Salir Admin">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
    </button>
  </nav>

  <!-- NAVBAR MOBILE (hamburguesa) -->
  <div class="mobile-nav-bar">
    <button class="hamburger-btn" id="hamburgerBtn" onclick="toggleMobileMenu()" aria-label="Abrir menú" aria-expanded="false">
      <span class="ham-line"></span>
      <span class="ham-line"></span>
      <span class="ham-line"></span>
    </button>
    <span class="mobile-nav-title" id="mobileNavTitle">Inicio</span>
    <div class="mobile-nav-actions">
      <button onclick="abrirLogin()" class="nav-btn btn-admin" id="btnAdminLoginMobile" title="Modo Admin">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </button>
      <button onclick="logout()" class="nav-btn btn-logout" id="btnAdminLogoutMobile" style="display:none" title="Salir Admin">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
      </button>
    </div>
  </div>

  <!-- MOBILE MENU DRAWER -->
  <div class="mobile-menu-overlay" id="mobileMenuOverlay" onclick="closeMobileMenu()"></div>
  <nav class="mobile-menu-drawer" id="mobileMenuDrawer" aria-label="Menú móvil">
    <div class="mobile-menu-header">
      <span class="mobile-menu-logo">⚽ Fútbol Viércoles</span>
      <button class="mobile-menu-close" onclick="closeMobileMenu()" aria-label="Cerrar menú">&#x2715;</button>
    </div>
    <div class="mobile-menu-items">
      <button onclick="mostrarSeccionMobile('inicio')" class="mobile-menu-item active-mobile" data-section="inicio">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Inicio
      </button>
      <button onclick="mostrarSeccionMobile('plantel')" class="mobile-menu-item" data-section="plantel">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Plantel
      </button>
      <button onclick="mostrarSeccionMobile('historial')" class="mobile-menu-item" data-section="historial">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Historial
      </button>
      <button onclick="mostrarSeccionMobile('ranking')" class="mobile-menu-item" data-section="ranking">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
        Ranking MVP
      </button>
      <button onclick="mostrarSeccionMobile('novedades')" class="mobile-menu-item" data-section="novedades">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Novedades
      </button>
      <button onclick="mostrarSeccionMobile('cumples')" class="mobile-menu-item" data-section="cumples">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Cumpleaños
      </button>
      <button onclick="mostrarSeccionMobile('palmares')" class="mobile-menu-item" data-section="palmares">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        Palmarés
      </button>
    </div>
  </nav>

  <!-- LOGIN MODAL -->
  <div id="modalLogin" class="modal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <div class="modal-content">
      <h3 id="loginTitle">Ingreso Admin</h3>
      <input type="password" id="passwordInput" placeholder="Contraseña" autocomplete="current-password">
      <div class="modal-actions">
        <button onclick="verificarLogin()">Ingresar</button>
        <button class="btn-secondary" onclick="document.getElementById('modalLogin').style.display='none'">Cancelar</button>
      </div>
    </div>
  </div>

  <main>

    <!-- SECCIÓN: INICIO -->
    <section id="inicio" class="seccion activa">
      <div class="cards-top">
        <div class="card highlight">
          <h3>Fecha actual</h3>
          <div id="fechaActual" class="stat-value">-</div>
        </div>
        <div class="card highlight">
          <h3>Jugador de la fecha</h3>
          <div id="jugadorTexto" class="stat-value">-</div>
          <div id="adminJugador" style="display:none;" class="admin-inline">
            <input type="text" id="inputJugador" placeholder="Nombre del MVP">
            <button onclick="guardarJugador()">Guardar</button>
          </div>
        </div>
      </div>

      <!-- CONTADOR REGRESIVO -->
      <div class="card countdown-card">
        <h3>Próximo partido</h3>
        <div id="countdownDisplay" class="countdown-display">
          <div class="countdown-unit"><span class="countdown-num" id="cdDias">--</span><span class="countdown-label">días</span></div>
          <div class="countdown-sep">:</div>
          <div class="countdown-unit"><span class="countdown-num" id="cdHoras">--</span><span class="countdown-label">horas</span></div>
          <div class="countdown-sep">:</div>
          <div class="countdown-unit"><span class="countdown-num" id="cdMinutos">--</span><span class="countdown-label">min</span></div>
          <div class="countdown-sep">:</div>
          <div class="countdown-unit"><span class="countdown-num" id="cdSegundos">--</span><span class="countdown-label">seg</span></div>
        </div>
        <div id="countdownFecha" class="countdown-fecha"></div>
      </div>

      <div class="card">
        <h2>Tabla de posiciones</h2>
        <div id="tabla"></div>
      </div>
      <div class="card">
        <h2>Partidos</h2>
        <div class="table-wrapper">
          <table id="partidos"></table>
        </div>
      </div>
    </section>

    <!-- SECCIÓN: PLANTEL -->
    <section id="plantel" class="seccion">
      <div class="card">
        <h2>Planteles</h2>
        <div class="equipo">
          <div class="equipo-titulo equipo-titulo-a" onclick="toggleEquipo('A')" role="button" tabindex="0" aria-expanded="false" id="titleA">
            <span>Equipo SEBA</span>
            <span class="chevron">▾</span>
          </div>
          <div class="equipo-admin" id="adminA" style="display:none;">
            <button onclick="agregarJugador('A')" id="btnA">+ Agregar jugador</button>
            <button onclick="setFotoEquipo('A')"  id="fotoA">📷 Foto equipo</button>
          </div>
          <img id="imgEquipoA" class="foto-equipo" style="display:none;" alt="Foto Equipo A">
          <div id="listaA" class="equipo-lista"></div>
        </div>
        <div class="equipo">
          <div class="equipo-titulo equipo-titulo-b" onclick="toggleEquipo('B')" role="button" tabindex="0" aria-expanded="false" id="titleB">
            <span>Equipo HEBER</span>
            <span class="chevron">▾</span>
          </div>
          <div class="equipo-admin" id="adminB" style="display:none;">
            <button onclick="agregarJugador('B')" id="btnB">+ Agregar jugador</button>
            <button onclick="setFotoEquipo('B')"  id="fotoB">📷 Foto equipo</button>
          </div>
          <img id="imgEquipoB" class="foto-equipo" style="display:none;" alt="Foto Equipo B">
          <div id="listaB" class="equipo-lista"></div>
        </div>
      </div>
    </section>

    <!-- SECCIÓN: HISTORIAL -->
    <section id="historial" class="seccion">
      <div class="card">
        <h2>Historial</h2>
        <div id="historialContenido"></div>
      </div>
    </section>

    <!-- SECCIÓN: RANKING -->
    <section id="ranking" class="seccion">
      <div class="card">
        <h2>Ranking MVP</h2>
        <div id="rankingContenido"></div>
      </div>
    </section>

    <!-- SECCIÓN: NOVEDADES -->
    <section id="novedades" class="seccion">
      <div class="card">
        <h2>Novedades</h2>
        <div id="adminNovedades" style="display:none;" class="novedades-admin-panel">
          <textarea id="novedadTexto" placeholder="Escribí la novedad..."></textarea>
          <button onclick="publicarNovedad()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            Publicar
          </button>
        </div>
        <div id="novedadesContenido"></div>
      </div>
    </section>

    <!-- SECCIÓN: CUMPLEAÑOS -->
    <section id="cumples" class="seccion">
      <div class="card">
        <h2>Cumpleaños</h2>
        <div id="cumpleContenido"></div>
      </div>
    </section>

    <!-- SECCIÓN: PALMARÉS -->
    <section id="palmares" class="seccion">
      <div id="palmaresContenido"></div>
    </section>

  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
